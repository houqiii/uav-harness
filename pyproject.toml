[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-harness"
version = "0.1.0"
description = "Intent scheduling and heterogeneous MAVLink control for ArduPilot and PX4"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymavlink==2.4.49", "pyserial>=3.5,<4", "prompt-toolkit>=3.0.53,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
uav-harness = "uav_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

